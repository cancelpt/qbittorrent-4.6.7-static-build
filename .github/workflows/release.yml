name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to build, for example v4.6.7-lt1.2.20-r3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      QBT_GPG_PRIVATE_KEY: ${{ secrets.QBT_GPG_PRIVATE_KEY }}
      QBT_GPG_PASSPHRASE: ${{ secrets.QBT_GPG_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository and release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patch rsync
          python3 -m pip install --upgrade pip pytest

      - name: Resolve release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${RELEASE_TAG_INPUT}"
          fi

          if [[ -z "${release_tag}" ]]; then
            printf 'missing release tag\n' >&2
            exit 1
          fi

          git check-ref-format "refs/tags/${release_tag}"
          printf 'QBT_RELEASE_TAG=%s\n' "${release_tag}" >> "${GITHUB_ENV}"

      - name: Check out resolved release ref
        run: |
          git check-ref-format "refs/tags/${QBT_RELEASE_TAG}"
          git fetch --no-tags origin "refs/tags/${QBT_RELEASE_TAG}:refs/tags/${QBT_RELEASE_TAG}"
          release_commit="$(git rev-parse --verify "refs/tags/${QBT_RELEASE_TAG}^{commit}")"
          git checkout --detach "${release_commit}"
          [[ "$(git rev-parse HEAD)" == "${release_commit}" ]]
          printf 'QBT_RELEASE_COMMIT=%s\n' "${release_commit}" >> "${GITHUB_ENV}"

      - name: Validate wrapper and release scripts
        run: |
          bash -n packaging/qbt-static/run-static-build.sh
          bash -n packaging/qbt-static/in-container-build.sh
          bash -n packaging/qbt-static/stage-release-assets.sh
          python3 -m pytest tests/test_qbt_static_wrapper.py -q
          node --test tests/test_webui_filters.js

      - name: Load public release metadata
        run: |
          set -a
          source packaging/qbt-static/config.env
          set +a
          [[ "${QBT_RELEASE_TAG}" == "${QBT_STATIC_PUBLIC_RELEASE_VERSION}" ]]
          printf 'QBT_STATIC_PUBLIC_RELEASE_VERSION=%s\n' "${QBT_STATIC_PUBLIC_RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Build static artifact
        run: bash packaging/qbt-static/run-static-build.sh build

      - name: Import optional release signing key
        if: ${{ env.QBT_GPG_PRIVATE_KEY != '' }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${QBT_GPG_PRIVATE_KEY}" | gpg --batch --import

          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec:/ {print $5; exit}')"
          if [[ -z "${key_id}" ]]; then
            printf 'missing imported release key\n' >&2
            exit 1
          fi

          {
            printf 'GNUPGHOME=%s\n' "${GNUPGHOME}"
            printf 'QBT_RELEASE_GPG_KEY_ID=%s\n' "${key_id}"
            if [[ -n "${QBT_GPG_PASSPHRASE:-}" ]]; then
              printf 'QBT_RELEASE_GPG_PASSPHRASE=%s\n' "${QBT_GPG_PASSPHRASE}"
            fi
          } >> "${GITHUB_ENV}"

      - name: Stage release assets and SHA256SUMS
        run: bash packaging/qbt-static/stage-release-assets.sh "${RUNNER_TEMP}/release-assets"

      - name: Stage draft GitHub Release assets
        run: |
          release_dir="${RUNNER_TEMP}/release-assets"

          if gh release view "${QBT_RELEASE_TAG}" > /dev/null 2>&1; then
            is_draft="$(gh release view "${QBT_RELEASE_TAG}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              printf 'refusing to replace assets of a published release\n' >&2
              exit 1
            fi
            gh release upload "${QBT_RELEASE_TAG}" "${release_dir}"/* --clobber
          else
            gh release create "${QBT_RELEASE_TAG}" "${release_dir}"/* \
              --draft \
              --title "qBittorrent static ${QBT_STATIC_PUBLIC_RELEASE_VERSION}" \
              --notes-file "docs/releases/${QBT_RELEASE_TAG}.md"
          fi
